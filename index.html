<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #debug {
        position: fixed; top: 8px; left: 8px; padding: 6px 8px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        color: #cfe8ff; background: rgba(0, 0, 0, 0.45); border-radius: 4px;
        white-space: pre; pointer-events: none;
      }
      #debug[hidden], #tweaks[hidden] { display: none; }
      #tweaks {
        position: fixed; top: 8px; right: 8px; width: 270px; max-height: calc(100% - 16px); overflow: auto;
        padding: 8px 10px; box-sizing: border-box; border-radius: 4px;
        font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #cfe8ff; background: rgba(0, 0, 0, 0.7);
      }
      #tweaks label { display: grid; grid-template-columns: 96px 1fr 40px; gap: 6px; align-items: center; }
      #tweaks input { width: 100%; }
      #tweaks p { margin: 0 0 6px; color: #8a97a6; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(6, 8, 11, 0.72); padding: 16px; overflow: auto;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8eef5;
      }
      #overlay[hidden] { display: none; }
      .panel {
        width: min(560px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box;
        background: #12161c; border: 1px solid #2c3540; border-radius: 8px; padding: 20px 24px;
      }
      .panel h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.02em; }
      .panel h2 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a97a6; }
      .panel p { margin: 0 0 8px; color: #c3ccd6; }
      .controls { display: grid; grid-template-columns: max-content 1fr; gap: 0 16px; margin: 0; font-size: 13px; }
      .controls dt { font-family: ui-monospace, Menlo, Consolas, monospace; color: #6fe3ff; }
      .controls dd { margin: 0; }
      .bindings { display: grid; gap: 2px; font-size: 13px; }
      .binding { display: grid; grid-template-columns: 1fr 120px 120px; align-items: center; gap: 6px; }
      .binding .key, .binding button.key {
        font-family: ui-monospace, Menlo, Consolas, monospace; color: #6fe3ff; padding: 3px 8px; text-align: left;
        background: #0b0d10; border: 1px solid #2c3540; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .binding span.key { border-color: transparent; background: transparent; }
      .binding button.key:hover, .binding button.key:focus-visible { border-color: #6fe3ff; }
      .binding button.key.listening { color: #ffd27a; border-color: #ffd27a; }
      .notice { margin: 4px 0 10px; padding: 8px 12px; border: 1px solid #5a3a32; border-radius: 6px; background: #1d1412; }
      .fatal details { margin: 8px 0; color: #9aa6b3; font-size: 12px; }
      .fatal pre { white-space: pre-wrap; max-height: 160px; overflow: auto; background: #0b0d10; padding: 8px; border-radius: 4px; }
      .row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 12px; margin: 6px 0; }
      .row select, .row input { width: 100%; box-sizing: border-box; }
      .row select { background: #0b0d10; color: inherit; border: 1px solid #2c3540; border-radius: 4px; padding: 6px; font: inherit; }
      .stats { margin: 12px 0 4px; padding: 10px 12px; background: #0b0d10; border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      .stats .bad { color: #ff6b5a; }
      .stats .dim { color: #9aa6b3; }
      .problems { margin: 4px 0; padding-left: 18px; color: #ff6b5a; }
      .problems:empty { display: none; }
      .panel.wide { width: min(680px, 100%); }
      .frames { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 12px; table-layout: fixed; }
      .frames th, .frames td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #222a33; vertical-align: top; }
      .frames th:first-child { width: 70px; color: #8a97a6; font-weight: 400; }
      .frames td { font-family: ui-monospace, Menlo, Consolas, monospace; color: #c3ccd6; }
      .frames .selected { background: #1d2530; color: #fff; }
      .frames thead .selected { color: #f0a55a; }
      .shop { width: 100%; border-collapse: collapse; font-size: 12px; }
      .shop th, .shop td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #222a33; }
      .shop th { font-weight: 400; color: #e6ebf0; white-space: nowrap; }
      .slots { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      .slots li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #222a33; color: #9aa6b3; }
      .slots li.active { color: #e6ebf0; }
      .slots button { padding: 3px 10px; white-space: nowrap; }
      .panel p.bad { color: #ff6b5a; font-size: 12px; margin: 4px 0 8px; }
      .shop th.special { color: #f0c27a; }
      .shop .needs { color: #e0a060; }
      select:disabled { color: #6b7684; }
      .panel p.dim { color: #9aa6b3; font-size: 12px; margin: 4px 0 8px; }
      .shop .count { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .shop .about { color: #9aa6b3; }
      .shop button { padding: 3px 10px; white-space: nowrap; }
      .shop button:disabled { color: #6b7684; border-color: #2a323c; cursor: not-allowed; }
      .panel.mapPanel { width: min(1040px, 100%); }
      .panel.offersPanel { width: min(1040px, 100%); }
      .offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 12px; }
      .offer { border: 1px solid #2c3540; border-top: 3px solid #8a97a6; border-radius: 4px; padding: 4px 14px 14px; display: flex; flex-direction: column; }
      .offer h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: #e8edf2; }
      .offer button:disabled { opacity: 0.45; cursor: not-allowed; }
      .offer .motto { font-style: italic; color: #e8edf2; margin-top: auto; padding-top: 6px; }
      .mapBody { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
      .map { width: 100%; aspect-ratio: 1; border: 1px solid #2c3540; border-radius: 4px; display: block; }
      .mapSide .dim { color: #9aa6b3; font-size: 13px; }
      .travel { display: grid; gap: 6px; }
      .travel button { text-align: left; padding: 6px 10px; }
      .travel button:disabled { color: #6b7684; border-color: #2a323c; cursor: not-allowed; }
      .places { margin: 0; padding-left: 18px; font-size: 13px; color: #c3ccd6; max-height: 220px; overflow: auto; }
      .factions { margin: 0 0 6px; padding: 0; list-style: none; font-size: 13px; color: #c3ccd6; display: grid; gap: 4px; }
      .factions .hostile { color: #ff8a7a; }
      .factions .allied { color: #7fdcff; }
      .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid #fff; }
      .places .held { color: #39c2ff; }
      .places .hostile { color: #ff8a7a; }
      @media (max-width: 760px) { .mapBody { grid-template-columns: 1fr; } }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      button { font: inherit; padding: 8px 16px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
      button.primary { background: #c9772b; color: #fff; font-weight: 600; }
      button.primary:hover { background: #dd8838; }
      button.primary:disabled { background: #4a4f57; color: #9aa6b3; cursor: not-allowed; }
      button.secondary { background: transparent; color: #c3ccd6; border-color: #3a4552; }
      button.secondary:hover { border-color: #6b7a8c; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #6fe3ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="debug" hidden></div>
    <div id="tweaks" hidden></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
